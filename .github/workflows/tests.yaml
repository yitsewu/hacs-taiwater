name: 驗證台水整合
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taiwater-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pytest-asyncio tzdata Pillow==12.3.0 numpy==2.3.2 ruff
      - run: ruff check custom_components tests scripts taiwater_ocr
      - run: pytest tests --ignore=tests/ha -q
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: taiwater-hacs
          path: dist/*.zip
  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/requirements-ha.txt
      - run: pip install -r .github/requirements-ha.txt
      - run: pytest tests/ha tests/test_entities.py tests/test_client.py -v --timeout=60
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  core-ocr:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Built-in OCR in clean official Core (no add-on)
        run: >-
          docker run --rm -v "$PWD:/work:ro" --entrypoint python
          ghcr.io/home-assistant/home-assistant:2026.9.1 /work/scripts/core_ocr_smoke.py
      - name: Install test-only legacy CPU emulator
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Core Python with SSE2/SSE3 legacy CPU baseline
        if: matrix.os == 'ubuntu-latest'
        run: >-
          docker run --rm -v "$PWD:/work:ro"
          -v /usr/bin/qemu-x86_64-static:/usr/local/bin/qemu-x86_64-static:ro
          --entrypoint /usr/local/bin/qemu-x86_64-static
          ghcr.io/home-assistant/home-assistant:2026.9.1
          -cpu qemu64 /usr/local/bin/python /work/scripts/core_ocr_smoke.py
  ocr:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build OCR app image
        run: docker build --build-arg BUILD_VERSION=ci --build-arg BUILD_ARCH=${{ matrix.arch }} -t taiwater-ocr taiwater_ocr
      - name: Start OCR app on CI loopback
        run: docker run --rm -d --name taiwater-ocr-ci -p 127.0.0.1:18080:8080 taiwater-ocr
      - name: Run synthetic-image HTTP smoke
        run: python scripts/ocr_smoke.py --url http://127.0.0.1:18080
      - name: Stop OCR app
        if: always()
        run: docker stop taiwater-ocr-ci || true
