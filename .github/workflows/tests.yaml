name: 驗證台水整合
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pytest-asyncio tzdata Pillow==12.1.0 ruff
      - run: ruff check custom_components tests scripts taiwater_ocr
      - run: pytest tests --ignore=tests/ha -q
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: taiwater-hacs
          path: dist/*.zip
  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/requirements-ha.txt
      - run: pip install -r .github/requirements-ha.txt
      - run: pytest tests/ha tests/test_entities.py -v
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  ocr:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build OCR app image
        run: docker build --build-arg BUILD_VERSION=ci --build-arg BUILD_ARCH=${{ matrix.arch }} -t taiwater-ocr taiwater_ocr
      - name: Start OCR app on CI loopback
        run: docker run --rm -d --name taiwater-ocr-ci -p 127.0.0.1:18080:8080 taiwater-ocr
      - name: Run synthetic-image HTTP smoke
        run: python scripts/ocr_smoke.py --url http://127.0.0.1:18080
      - name: Stop OCR app
        if: always()
        run: docker stop taiwater-ocr-ci || true
